    <script>
      // Runs before the first paint: theme, language and design version are
      // known immediately, so the page never flashes with the wrong ones.
      (function () {
        var root = document.documentElement;
        var stored = function (key) {
          try {
            return localStorage.getItem(key);
          } catch (error) {
            return null;
          }
        };
        var theme = stored("theme");
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";

        root.setAttribute("data-theme", theme);
        // Tab icon in the colors of the theme, now and after each switch.
        var icons = document.querySelectorAll("link[data-icon-dark]");
        var setIcons = function () {
          var dark = root.getAttribute("data-theme") === "dark";
          for (var i = 0; i < icons.length; i++) {
            var link = icons[i];
            if (!link.hasAttribute("data-icon-light")) {
              link.setAttribute("data-icon-light", link.getAttribute("href"));
            }
            var href = link.getAttribute(
              dark ? "data-icon-dark" : "data-icon-light",
            );
            if (link.getAttribute("href") !== href)
              link.setAttribute("href", href);
          }
        };
        setIcons();
        new MutationObserver(setIcons).observe(root, {
          attributes: true,
          attributeFilter: ["data-theme"],
        });
        if (theme === "dark") {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#101b17");

        var language = stored("lang") || navigator.language || "fr";

          link.as = as;
          if (type) link.type = type;
          if (as === "font") link.crossOrigin = "anonymous";
          document.head.appendChild(link);
